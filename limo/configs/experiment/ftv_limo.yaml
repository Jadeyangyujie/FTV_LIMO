# @package _global_

defaults:
  - override /dataset: limo_local
  - override /logger: wandb

tags: ["local", "ftv_limo", "D_aug"]

dataset:
  return_image_seq: true
  temporal_len: 4
  temporal_stride: 1
  strict_camera_timestamp_alignment: true
  return_current_images: false

  with_side_cams: false
  camera_views: ["front", "left", "right"]

  batch_size: 4
  num_workers: 4
  pin_memory: true


model:
  optimizer:
    lr: 0.0001
    weight_decay: 0.01

  scheduler: null


trainer:
  max_epochs: 16
  accelerator: gpu
  devices: 2
  strategy: ddp
  precision: 16-mixed

  # FTV 一次样本包含 T*V 张图，显存更大。
  # batch_size=2 + accumulate=2，可以近似保持 effective batch size = 4。
  accumulate_grad_batches: 2
  log_every_n_steps: 20


  num_sanity_val_steps: 0
  benchmark: true


  limit_train_batches: 1.0
  limit_val_batches: 1.0


logger:
  wandb:
    tags: ${tags}

seed: 12345


callbacks:
  # DDP 下先禁用 safetensors，避免多进程同时写同一个文件
  safetensors: null
