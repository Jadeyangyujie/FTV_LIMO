# @package _global_

defaults:
  - dataset: limo_local
  - model: limo_ftv
  - callbacks: default
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - logger: csv
  - _self_

task_name: "train"

tags: ["FTV-LIMO", "medium", "T4V3", "epoch20"]

ckpt_path: null

seed: 12345

dataset:
  dataset_folder: ${oc.env:DATA_PARENT}
  missions_csv: ${oc.env:REPO}/limo/configs/dataset/missions_split_ftv_valid.csv
  dataset_type: aug

  return_image_seq: true
  temporal_len: 4
  temporal_stride: 1

  with_side_cams: false
  camera_views: ["front", "left", "right"]

  batch_size: 4
  num_workers: 4
  pin_memory: true

# model:
#   net:
#     pretrained: true

model:
  optimizer:
    lr: 0.0001
    weight_decay: 0.01

  scheduler: null


trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 2
  strategy: ddp
  precision: 16-mixed

  # FTV 一次样本包含 T*V 张图，显存更大。
  # batch_size=2 + accumulate=2，可以近似保持 effective batch size = 4。
  accumulate_grad_batches: 2
  log_every_n_steps: 20


  num_sanity_val_steps: 0
  benchmark: true


  limit_train_batches: 0.1
  limit_val_batches: 0.1

callbacks:
  # DDP 下先禁用 safetensors，避免多进程同时写同一个文件
  safetensors: null

extras:
  enforce_tags: false
  print_config: false

logger:
  csv:
    name: "csv"
    prefix: ""

hydra:
  run:
    dir:  ${hydra:runtime.cwd}/logs/${task_name}/ftv_limo/${now:%Y-%m-%d}_${now:%H-%M-%S}