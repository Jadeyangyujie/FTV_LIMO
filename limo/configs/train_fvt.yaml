# @package _global_

defaults:
  - dataset: limo_local
  - model: limo
  - callbacks: default
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - logger: csv
  - _self_

task_name: "train"

tags: ["FTV-LIMO", "medium", "T4V3", "epoch20"]

ckpt_path: null

seed: null

dataset:
  dataset_folder: ${oc.env:DATA_PARENT}
  missions_csv: ${oc.env:REPO}/limo/configs/dataset/missions_split_ftv_medium.csv
  dataset_type: aug

  return_image_seq: true
  temporal_len: 4
  temporal_stride: 1

  with_side_cams: true
  camera_views: ["front", "left", "right"]

  batch_size: 4
  num_workers: 8
  pin_memory: true

model:
  net:
    pretrained: true

trainer:
  max_epochs: 20
  accelerator: gpu
  devices: 1
  precision: 16-mixed

  # FTV 一次样本包含 T*V 张图，显存更大。
  # batch_size=2 + accumulate=2，可以近似保持 effective batch size = 4。
  accumulate_grad_batches: 4

extras:
  enforce_tags: false
  print_config: false

logger:
  csv:
    name: "csv"
    prefix: ""

hydra:
  run:
    dir:  ${hydra:runtime.cwd}/logs/${task_name}/runs/ftv_limo/${now:%Y-%m-%d}_${now:%H-%M-%S}