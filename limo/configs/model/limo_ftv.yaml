_target_: limo.src.models.limo_model.LimoModel

net:
  _target_: limo.src.models.components.limo_net_ftv.LimoNetFTV
  pretrained: true
  temporal_len: 4
  num_views: 3
  compressed_tokens: 16
  view_tokens: 16

loss:
  _target_: torch.nn.MSELoss

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  _partial_: true
  max_lr: 0.0001
  div_factor: 100


camera_info: ${paths.root_dir}/limo/configs/model/camera_info.yaml

compile: false
